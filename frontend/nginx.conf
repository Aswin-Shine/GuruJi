# =============================================================================
#  GuruJi web — nginx
#
#  Runs as the unprivileged `nginx` user on :8080 with a read-only root
#  filesystem. Every writable path is redirected into the tmpfs mounted at /tmp
#  by docker-compose.yml; if you remove that tmpfs, nginx will not start.
#
#  Deliberately does NOT use the `map` directive anywhere. nginx 1.30.4 fixed
#  CVE-2026-42533, a buffer overflow in `map` with regex captures. The config
#  does not need map, so not having the code path at all is cheaper than
#  reasoning about whether our usage is the vulnerable one.
# =============================================================================

worker_processes auto;
pid /tmp/nginx.pid;

# Logs to the container's stdout/stderr so Docker/CloudWatch collects them and
# nothing is written to the read-only filesystem.
error_log /dev/stderr warn;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Every scratch path moved off the read-only root.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Do not advertise the version to anyone fingerprinting the stack.
    server_tokens off;

    log_format json escape=json '{"t":"$time_iso8601","ip":"$remote_addr",'
        '"m":"$request_method","u":"$uri","s":$status,'
        '"b":$body_bytes_sent,"rt":$request_time,"ua":"$http_user_agent"}';
    access_log /dev/stdout json;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    reset_timedout_connection on;

    # A tutoring message is at most 2000 characters. Anything near a megabyte is
    # not a student; refuse it before it reaches the single backend container.
    client_max_body_size 32k;
    client_body_buffer_size 16k;
    large_client_header_buffers 4 8k;

    # Slowloris: cap how long a client may take to send its request.
    client_body_timeout 12s;
    client_header_timeout 12s;
    send_timeout 20s;

    # ---- compression --------------------------------------------------------
    # gzip_static serves the .gz files produced at build time (gzip -9). That is
    # better compression than nginx can afford to do per-request AND costs zero
    # CPU while serving, which matters because this container is also the only
    # thing standing between a traffic spike and one FastAPI process.
    gzip_static on;
    gzip_vary on;
    # Dynamic gzip stays on only for proxied API JSON, which has no static twin.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types application/json;

    # ---- edge rate limits ---------------------------------------------------
    #
    # NOTE ON SHARED IPs — READ BEFORE TIGHTENING THESE.
    # Keyed on client IP. In Tier-2/3 India a whole household, cyber-cafe or
    # school commonly sits behind one NAT address, so an aggressive per-IP limit
    # bans a classroom, not an attacker. These are set loose on purpose: the
    # real per-user limit is the backend's 20/min keyed on user_id, and this
    # layer exists only to stop unauthenticated flooding from reaching Python.
    limit_req_zone  $binary_remote_addr zone=api:10m  rate=240r/m;
    limit_req_zone  $binary_remote_addr zone=auth:10m rate=20r/m;
    limit_conn_zone $binary_remote_addr zone=conns:10m;
    limit_req_status 429;
    limit_conn_status 429;

    upstream guruji_api {
        server api:8000 max_fails=3 fail_timeout=10s;
        # Reuse upstream connections: without this every message costs a fresh
        # TCP handshake to the backend under load.
        keepalive 32;
    }

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        limit_conn conns 24;

        # ---- security headers ------------------------------------------------
        # `always` so they are present on error responses too, not just 200s.

        # CSP. 'self' everywhere, no 'unsafe-inline' anywhere, no external hosts
        # — which is only possible because the build emits zero inline scripts,
        # the fonts are system fonts, and the API is same-origin.
        # img-src includes blob: for photo questions. A photo the student just
        # picked is previewed from a URL.createObjectURL() handle, which is a
        # blob: URL — without it the browser blocks the preview and renders a
        # broken-image icon. blob: can only reference data this page itself
        # created, so it is not a remote-content allowance.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;

        # Next hardening step, staged the safe way: collect violations before
        # enforcing. Trusted Types would neutralise the entire innerHTML sink
        # class. Enable, watch reports for a week, then fold into the line above.
        # add_header Content-Security-Policy-Report-Only "require-trusted-types-for 'script'; report-uri /csp-report" always;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        # no-referrer, not the usual strict-origin-when-cross-origin: the parent
        # invite link carries a PIN, and the strongest guarantee is that this app
        # never emits a Referer header at all.
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), accelerometer=(), gyroscope=(), interest-cohort=()" always;
        # HSTS. Only meaningful once TLS terminates in front of this container;
        # harmless over plain HTTP in local dev. Add `preload` only when you are
        # certain every subdomain is HTTPS — it is very hard to undo.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ---- container health (not the app's /health) ------------------------
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # ---- API reverse proxy ----------------------------------------------
        #
        # Same-origin by design. The browser never issues a cross-origin request,
        # so there is no CORS preflight on the message path (one fewer round trip
        # on a slow mobile link) and the backend's ALLOWED_WEB_ORIGINS can stay
        # empty, which is its safest configuration.

        # Auth endpoints get their own, much tighter bucket: OTP request is the
        # one route that could cost real money per call once Phase 2 delivery
        # lands, and credential stuffing lives here.
        #
        # proxy_pass is explicit and DIFFERENT per location on purpose — do not
        # "simplify" this back into the shared include. This location's prefix
        # (/api/v1/auth/) is longer than the general one (/api/), so the same
        # rewrite rule would strip a different amount off each request. Getting
        # this wrong sends /api/v1/auth/otp/request to the backend as
        # /otp/request instead of /v1/auth/otp/request — a real 404 this project
        # shipped once already. The `/v1/auth/` after the host below re-adds
        # exactly what this location's own prefix consumes.
        location ^~ /api/v1/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://guruji_api/v1/auth/;
            include /etc/nginx/conf.d/proxy_headers.inc;
        }

        # Photo questions carry an image, so the server-wide 32k ceiling would
        # reject every one of them. Raised HERE ONLY, so the limit protecting every
        # other endpoint is untouched — a global raise would let any route accept
        # a 6 MB body.
        #
        # This block sets ONLY client_max_body_size and limit_req. Everything else
        # comes from proxy_headers.inc, which already sets proxy_request_buffering,
        # proxy_connect_timeout, proxy_send_timeout and proxy_read_timeout. nginx
        # refuses to start on a duplicate directive rather than letting the later
        # one win, so re-stating any of them here takes the whole site down.
        #
        # The include's 45s read timeout covers a photo turn: the app's own vision
        # call and tutoring call are individually bounded well below that.
        location = /api/v1/conversations/photo {
            # 6m, deliberately ABOVE the app's 5 MB MAX_IMAGE_BYTES, so the app is
            # the layer that rejects an oversized photo and can say so in Hinglish.
            # nginx can only return a bare 413.
            client_max_body_size 6m;
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://guruji_api/v1/conversations/photo;
            include /etc/nginx/conf.d/proxy_headers.inc;
        }

        location ^~ /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://guruji_api/;
            include /etc/nginx/conf.d/proxy_headers.inc;
        }

        # ---- static assets ---------------------------------------------------
        # Filenames are content-hashed by Vite, so a URL's bytes never change and
        # a one-year immutable cache is safe. This is what keeps a returning
        # student's app load at zero network bytes.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
            # Never fall back to index.html here: a missing hashed asset is a bad
            # deploy, and returning HTML with a .js content type would hide it.
            try_files $uri =404;
        }

        location = /manifest.webmanifest {
            expires 1h;
            add_header Cache-Control "public, max-age=3600" always;
        }

        location = /icon.svg {
            expires 7d;
            add_header Cache-Control "public, max-age=604800" always;
        }

        location = /robots.txt {
            access_log off;
            expires 1d;
        }

        # ---- SPA fallback ----------------------------------------------------
        # index.html must never be cached: it is the file that points at the
        # current hashed bundle, so a stale copy pins users to an old release.
        location / {
            add_header Cache-Control "no-store, must-revalidate" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            try_files $uri $uri/ /index.html;
        }

        # Do not serve dotfiles even if one is ever copied in by mistake.
        location ~ /\. {
            deny all;
            access_log off;
        }
    }
}
